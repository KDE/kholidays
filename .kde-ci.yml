Dependencies:
  - 'on': ['@all']
    'require':
      'frameworks/extra-cmake-modules': '@same'

Options:
  # the syntax check test must run after the install
  test-before-installing: False
  require-passing-tests-on: ['Linux', 'FreeBSD', 'Windows']
  enable-lsan: True
  cppcheck-arguments: '--enable=warning,performance,portability,style --suppress-xml=cppcheck-suppressions.xml'
  require-cppcheck-clean: True
  run-installed-library-check-on: ['@all']
